services:
  mysql:
    image: mysql:8.0
    container_name: embedixe-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: embedixe
      MYSQL_USER: embedixe
      MYSQL_PASSWORD: embedixe123
    ports:
      - '3306:3306'
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', 'localhost']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: embedixe-backend
    restart: unless-stopped
    ports:
      - '4000:4000'
    environment:
      NODE_ENV: development
      PORT: 4000
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: embedixe
      DB_PASSWORD: embedixe123
      DB_NAME: embedixe
      JWT_SECRET: change-this-in-production
      ADMIN_EMAIL: admin@embedixe.com
      ADMIN_PASSWORD: admin123
      CORS_ORIGIN: http://localhost:7777
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

volumes:
  mysql_data:
