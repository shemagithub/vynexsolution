<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vynex Solutions Admin</title>
  <link rel="stylesheet" href="/admin/styles.css">
</head>
<body>
  <div id="app">
    <div id="login-screen" class="login-screen">
      <form id="login-form" class="login-card">
        <h1>Vynex Admin</h1>
        <p>Sign in to manage your website content</p>
        <label>Email<input type="email" name="email" required autocomplete="username"></label>
        <label>Password
          <span class="password-field">
            <input id="login-password" type="password" name="password" required autocomplete="current-password">
            <button type="button" class="password-toggle" id="toggle-password" aria-label="Show password" aria-pressed="false" title="Show password">
              <svg class="icon-eye" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5c-7.6 0-10 7-10 7s2.4 7 10 7 10-7 10-7-2.4-7-10-7Zm0 12a5 5 0 1 1 0-10 5 5 0 0 1 0 10Zm0-8a3 3 0 1 0 0 6 3 3 0 0 0 0-6Z"/></svg>
              <svg class="icon-eye-off hidden" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.1 3.51 3.5 2.1l18.4 18.39-1.41 1.41-2.46-2.45C16.07 20.4 14.14 21 12 21c-7.6 0-10-7-10-7a18.6 18.6 0 0 1 5.05-5.8L2.1 3.51ZM12 7a5 5 0 0 1 4.9 4.02l-1.6-1.6A3 3 0 0 0 12 9a3 3 0 0 0-2.42 1.22L8.1 8.74A4.97 4.97 0 0 1 12 7Zm10 5s-.66 1.92-2.24 3.66l-1.45-1.45A15.3 15.3 0 0 0 20.9 12S18.5 5 12 5c-.84 0-1.62.1-2.35.28L7.94 3.57C9.2 3.2 10.55 3 12 3c7.6 0 10 7 10 7ZM9.88 12.1 8.4 10.62A3 3 0 0 0 12 15a2.97 2.97 0 0 0 1.78-.6l-1.48-1.48c-.1.04-.2.08-.3.08a1 1 0 0 1-1-.9c0-.1.03-.2.06-.3Z"/></svg>
            </button>
          </span>
        </label>
        <button type="submit">Sign in</button>
        <p id="login-error" class="error hidden"></p>
      </form>
    </div>

    <div id="dashboard" class="dashboard hidden">
      <aside class="sidebar">
        <div class="brand">Vynex Solutions</div>
        <nav>
          <button data-view="overview" class="nav-btn active">Dashboard</button>
          <button data-view="projects" class="nav-btn">Projects</button>
          <button data-view="services" class="nav-btn">Services</button>
          <button data-view="testimonials" class="nav-btn">Testimonials</button>
          <button data-view="pricing" class="nav-btn">Pricing</button>
          <button data-view="articles" class="nav-btn">Articles</button>
          <button data-view="contacts" class="nav-btn">Contact Messages</button>
          <button data-view="quotes" class="nav-btn">Quote Requests</button>
          <button data-view="mail" class="nav-btn">Mail</button>
          <button data-view="settings" class="nav-btn">Site Settings</button>
        </nav>
        <button id="logout-btn" class="logout-btn">Sign out</button>
      </aside>

      <main class="main">
        <header class="topbar">
          <h2 id="page-title">Dashboard</h2>
          <span id="user-name"></span>
        </header>
        <div id="content" class="content"></div>
      </main>
    </div>
  </div>

  <dialog id="modal">
    <form id="modal-form" method="dialog">
      <div id="modal-body"></div>
      <div class="modal-actions">
        <button type="button" id="modal-cancel">Cancel</button>
        <button type="submit" id="modal-save">Save</button>
      </div>
    </form>
  </dialog>

<script src="/admin/app.js" type="module"></script>
</body>
</html>
